
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_standalone_course_platform
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - networkname
    mem_limit: 128m
    cpus: 0.1
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower-cf:
    image: nickfedor/watchtower:latest
    container_name: watchtower_cf_course_platform
    restart: unless-stopped
    environment:
      - TZ=Asia/Riyadh
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --label-enable
      - --cleanup
      - --schedule
      - "0 0 6 * * 5"
      - --stop-timeout
      - 30s
    mem_limit: 128m
    cpus: 0.1

networks:
  networkname:
    external: true
